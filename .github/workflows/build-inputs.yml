name: Check offline rebuild

on:
  workflow_call:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Collect pinned source and build images
        run: python3 build_inputs.py collect "$RUNNER_TEMP/build-inputs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-inputs
          path: ${{ runner.temp }}/build-inputs
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  restore:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-inputs
          path: ${{ runner.temp }}/build-inputs
      - name: Restore and build with no container network or compilation cache
        run: python3 build_inputs.py verify "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-verification
          path: ${{ runner.temp }}/verification.json
          retention-days: 1
          if-no-files-found: error
